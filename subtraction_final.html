<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>直式減法</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f0f0f0;
      }

      #scroll-container {
        max-height: 200px; /* 設定容器的最大高度 */
        overflow-y: auto; /* 當內容超過高度時顯示滾動條 */
        border: 1px solid #ccc; /* 容器邊框 */
        padding: 10px; /* 容器內邊距 */
        border-radius: 5px; /* 圓角 */
      }

      .radio-group {
        border: 2px solid #ccc;
        border-radius: 5px;
        padding: 15px;
        background-color: #f9f9f9;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      .radio-group label {
        margin-bottom: 10px;
        cursor: pointer;
      }
      .radio-group input[type="radio"] {
        margin-right: 10px;
      }

      .game-container,
      .result-container,
      .menu-container {
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 500px;
        position: relative;
        text-align: center;
      }
      .menu-container {
        height: 450px;
      }
      .result-container {
        height: 450px;
      }
      .game-container {
        height: 450px;
      }

      table {
        border-collapse: collapse;
        margin: 20px;
      }
      td {
        width: 50px;
        height: 50px;
        text-align: center;
        font-size: 36px;
        border: 1px solid #000;
        vertical-align: bottom;
      }
      .no-border {
        border: none;
      }
      .line {
        border-top: 5px solid #008cba;
      }
      .result {
        background-color: #e0f7e9;
      }
      @keyframes shake {
        0% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-5px);
        }
        50% {
          transform: translateX(5px);
        }
        75% {
          transform: translateX(-5px);
        }
        100% {
          transform: translateX(0);
        }
      }
      .shake {
        animation: shake 0.3s;
      }
    </style>
    <script language="JavaScript">
      let minuendReal = 0;
      let subtrahendReal = 0;

      let repeatCount;
      let currentRepeat = 0; // 當前的重複次數

      let totalQuestions,
        currentQuestion = 0;

      let timerInterval;
      let elapsedTime = 0; // 以秒為單位

      let isPaused = false; // 用來跟蹤計時器是否暫停

      let focusArray = [];

      function togglePause() {
        if (isPaused) {
          // 如果目前是暫停狀態，則恢復計時
          startTimer();
          document.getElementById("pause-button").textContent = "暫停";
          // 將焦點還原到之前的輸入框
          if (currentInputId) {
            document.getElementById(currentInputId).focus();
          }
        } else {
          // 暫停計時
          clearInterval(timerInterval);
          document.getElementById("pause-button").textContent = "恢復";
          // 儲存當前聚焦的輸入框ID
          currentInputId = document.activeElement.id;
        }
        isPaused = !isPaused; // 切換暫停狀態
      }

      function startTimer() {
        timerInterval = setInterval(() => {
          if (!isPaused) {
            // 只有當不在暫停狀態時才增加時間
            elapsedTime++;
            const minutes = Math.floor(elapsedTime / 60);
            const seconds = elapsedTime % 60;
            document.getElementById("elapsed-time").textContent = `${String(
              minutes
            ).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
          }
        }, 1000);
      }

      function startGame() {
        const userName = document.getElementById("user-name").value; // 獲取用戶輸入的姓名
        totalQuestions = parseInt(
          document.getElementById("question-count").value
        );
        repeatCount = parseInt(document.getElementById("repeat-count").value); // 獲取重複次數
        currentQuestion = 0;
        currentRepeat = 0; // 重置重複次數
        elapsedTime = 0; // 重置計時
        minuendReal = 0;
        subtrahendReal = 0;
        document.getElementById("total-questions").textContent = totalQuestions; // 設定總題數
        document.getElementById("menu-container").style.display = "none";
        document.getElementById("game-container").style.display = "block";
        startTimer(); // 啟動碼錶
        generateProblem();
        window.userName = userName;
      }

      function generateProblem() {
        console.log(
          `currentRepeat是${currentRepeat},repeatCount是${repeatCount}`
        );

        if(currentRepeat==0){
          currentQuestion++;
          if (currentQuestion > totalQuestions) {
            showResult();
            return;
          }      
        }

        if (currentRepeat < repeatCount ) {
          currentRepeat++; // 表示是第幾次作答
          document.getElementById("currentRepeatTag").textContent=currentRepeat+"/"+repeatCount;
        } 

        // 更新題號顯示
        document.getElementById("current-question").textContent =
          currentQuestion;
        document.getElementById("total-questions").textContent = totalQuestions;

        focusArray = [];

        let inputOnes = document.getElementById("inputOnes");
        let inputTens = document.getElementById("inputTens");
        let inputHundreds = document.getElementById("inputHundreds");
        let borrowOnes = document.getElementById("borrowOnes");
        let borrowTens = document.getElementById("borrowTens");
        let borrow2Tens = document.getElementById("borrow2Tens");
        let borrowHundreds = document.getElementById("borrowHundreds");
        let minuendHundreds = document.getElementById("minuendHundreds");
        let minuendTens = document.getElementById("minuendTens");
        let minuendOnes = document.getElementById("minuendOnes");
        let subtrahendOnes = document.getElementById("subtrahendOnes");
        let subtrahendTens = document.getElementById("subtrahendTens");
        let subtrahendHundreds = document.getElementById("subtrahendHundreds");
        var promptMessage = document.getElementById("promptMessage");

        promptMessage.style.display = "none";
        promptMessage.innerText = "";
        inputOnes.style.display = "none";
        inputTens.style.display = "none";
        inputHundreds.style.display = "none";
        borrowOnes.style.display = "none";
        borrowTens.style.display = "none";
        borrow2Tens.style.display = "none";
        borrowHundreds.style.display = "none";

        inputOnes.value = "";
        inputTens.value = "";
        inputHundreds.value = "";
        borrowOnes.value = "";
        borrowTens.value = "";
        borrow2Tens.value = "";
        borrowHundreds.value = "";

        minuendHundreds.style.textDecoration = "none";
        minuendHundreds.style.textDecorationColor = "red";

        minuendTens.style.textDecoration = "none";
        minuendTens.style.textDecorationColor = "red";

        borrowTens.style.textDecoration = "none";
        borrowTens.style.textDecorationColor = "red";

        minuendHundreds.style.color = "black";
        minuendTens.style.color = "black";
        borrowTens.style.color = "red";
        subtrahendHundreds.style.color = "black";
        subtrahendTens.style.color = "black";

        let minuend = 0;
        let subtrahend = 0;

        // 獲取單元資訊
        const subtractionTypeValue = document.querySelector(
          'input[name="subtractionType"]:checked'
        ).value;

        const borrowType = document.querySelector(
          'input[name="borrowType"]:checked'
        ).value;

        switch (subtractionTypeValue) {
          case "1-1":
            minuend = Math.floor(Math.random() * 9) + 1;
            subtrahend = Math.floor(Math.random() * 9) + 1;

            if (subtrahend > minuend) {
              let tmpNum = minuend;
              minuend = subtrahend;
              subtrahend = tmpNum;
            }

            break;
          case "2-1":
            if (borrowType == "3") {
              minuend = Math.floor(Math.random() * 9) + 1;
              subtrahend = Math.floor(Math.random() * minuend) + 1;
              minuend = (Math.floor(Math.random() * 9) + 1) * 10 + minuend;
            } else if (borrowType == "2") {
              subtrahend = Math.floor(Math.random() * 9) + 1;
              minuend = Math.floor(Math.random() * subtrahend);
              minuend = (Math.floor(Math.random() * 9) + 1) * 10 + minuend;
            } else {
              minuend = Math.floor(Math.random() * 90) + 10;
              subtrahend = Math.floor(Math.random() * 9) + 1;
            }
            break;
          case "2-2":
            if (borrowType == "3") {
              var minuend1 = Math.floor(Math.random() * 10);
              var subtrahend1 = Math.floor(Math.random() * (minuend1 + 1));

              var minuend2 = Math.floor(Math.random() * 9) + 1;
              var subtrahend2 = Math.floor(Math.random() * minuend2) + 1;

              minuend = minuend2 * 10 + minuend1;
              subtrahend = subtrahend2 * 10 + subtrahend1;
            } else if (borrowType == "2") {
              var subtrahend1 = Math.floor(Math.random() * 9) + 1;
              var minuend1 = Math.floor(Math.random() * subtrahend1);

              var minuend2 = Math.floor(Math.random() * 9) + 1;
              var subtrahend2 = Math.floor(Math.random() * minuend2);
              minuend = minuend2 * 10 + minuend1;
              subtrahend = subtrahend2 * 10 + subtrahend1;
            } else {
              minuend = Math.floor(Math.random() * 90) + 10;
              subtrahend = Math.floor(Math.random() * 90) + 10;
              if (subtrahend > minuend) {
                let tmpNum = minuend;
                minuend = subtrahend;
                subtrahend = tmpNum;
              }
            }
            break;
          case "3-1":
            if (borrowType == "3") {
              minuend = Math.floor(Math.random() * 9) + 1;
              subtrahend = Math.floor(Math.random() * minuend) + 1;
              minuend = (Math.floor(Math.random() * 90) + 10) * 10 + minuend;
            } else if (borrowType == "2") {
              subtrahend = Math.floor(Math.random() * 9) + 1;
              minuend = Math.floor(Math.random() * subtrahend);
              minuend = (Math.floor(Math.random() * 90) + 10) * 10 + minuend;
            } else {
              minuend = Math.floor(Math.random() * 900) + 100;
              subtrahend = Math.floor(Math.random() * 9) + 1;
            }
            break;
          case "3-2":
            if (borrowType == "3") {
              var minuend1 = Math.floor(Math.random() * 10);
              var subtrahend1 = Math.floor(Math.random() * (minuend1 + 1));

              var minuend2 = Math.floor(Math.random() * 9) + 1;
              var subtrahend2 = Math.floor(Math.random() * (minuend2 - 1)) + 1;

              minuend =
                (Math.floor(Math.random() * 9) + 1) * 100 +
                minuend2 * 10 +
                minuend1;

              subtrahend = subtrahend2 * 10 + subtrahend1;
            } else if (borrowType == "2") {
              var subtrahend1 = Math.floor(Math.random() * 10);
              var minuend1 = Math.floor(Math.random() * subtrahend1);
              var subtrahend2 = Math.floor(Math.random() * 9) + 1;
              var minuend2 = Math.floor(Math.random() * subtrahend1);

              minuend =
                (Math.floor(Math.random() * 9) + 1) * 100 +
                minuend2 * 10 +
                minuend1;

              subtrahend = subtrahend2 * 10 + subtrahend1;
            } else {
              minuend = Math.floor(Math.random() * 900) + 100;
              subtrahend = Math.floor(Math.random() * 90) + 10;
            }
            break;
          case "3-3":
            if (borrowType == "3") {
              var minuend1 = Math.floor(Math.random() * 10);
              var subtrahend1 = Math.floor(Math.random() * (minuend1 + 1));

              var minuend2 = Math.floor(Math.random() * 10);
              var subtrahend2 = Math.floor(Math.random() * (minuend2 + 1));

              var minuend3 = Math.floor(Math.random() * 9) + 1;
              var subtrahend3 = Math.floor(Math.random() * (minuend3 + 1));
              minuend = minuend3 * 100 + minuend2 * 10 + minuend1;
              subtrahend = subtrahend3 * 100 + subtrahend2 * 10 + subtrahend1;
            } else if (borrowType == "2") {
              var subtrahend1 = Math.floor(Math.random() * 10);
              var minuend1 = Math.floor(Math.random() * subtrahend1);
              var subtrahend2 = Math.floor(Math.random() * 10);
              var minuend2 = Math.floor(Math.random() * subtrahend1);

              var minuend3 = Math.floor(Math.random() * 9) + 1;
              var subtrahend3 = Math.floor(Math.random() * minuend3) + 1;
              minuend = minuend3 * 100 + minuend2 * 10 + minuend1;
              subtrahend = subtrahend3 * 100 + subtrahend2 * 10 + subtrahend1;
            } else {
              minuend = Math.floor(Math.random() * 900) + 100;
              subtrahend = Math.floor(Math.random() * 900) + 100;
              if (subtrahend > minuend) {
                let tmpNum = minuend;
                minuend = subtrahend;
                subtrahend = tmpNum;
              }
            }
            break;
        }

        //minuend = 404;
        //subtrahend = 337;
        console.log(currentRepeat + ":" + repeatCount);

        // 計算正確答案
        if (currentRepeat == 1) {
          minuendReal = minuend;
          subtrahendReal = subtrahend;
        }

        if (currentRepeat == repeatCount) {
          currentRepeat = 0;
        }

        let result = minuendReal - subtrahendReal;

        if (minuendReal < 100) {
          minuendHundreds.style.color = "white";
          if (minuendReal < 10) {
            minuendTens.style.color = "white";
          }
        }

        if (subtrahendReal < 100) {
          subtrahendHundreds.style.color = "white";
          if (subtrahendReal < 10) {
            subtrahendTens.style.color = "white";
          }
        }

        // 更新 HTML 中的數值
        minuendOnes.innerText = minuendReal % 10;
        minuendTens.innerText = Math.floor((minuendReal % 100) / 10);
        minuendHundreds.innerText = Math.floor((minuendReal % 1000) / 100);

        subtrahendOnes.innerText = subtrahendReal % 10;
        subtrahendTens.innerText = Math.floor((subtrahendReal % 100) / 10);
        subtrahendHundreds.innerText = Math.floor(
          (subtrahendReal % 1000) / 100
        );

        // 設定正確答案值
        document.getElementById("resultMessage").innerText = "";

        inputOnes.correctValue = result % 10;
        inputTens.correctValue = Math.floor((result % 100) / 10);
        inputHundreds.correctValue = Math.floor((result % 1000) / 100);

        if (minuendOnes.innerText >= subtrahendOnes.innerText) {
          borrowOnes.correctValue = -1;
          //inputOnes.focus();
          focusArray.push(inputOnes);
          if (minuendTens.innerText >= subtrahendTens.innerText) {
            borrow2Tens.correctValue = -1;
            borrowTens.correctValue = -1;

            focusArray.push(inputTens);
            focusArray.push(inputHundreds);
          } else {
            borrowTens.correctValue = 10;
            borrow2Tens.correctValue = -1;
            borrowHundreds.correctValue = minuendHundreds.innerText - 1;

            focusArray.push(minuendHundreds);
            focusArray.push(borrowHundreds);
            focusArray.push(borrowTens);
            focusArray.push(inputTens);
            focusArray.push(inputHundreds);
            //minuendHundreds.style.textDecoration = "line-through";
          }
        } else {
          borrowOnes.correctValue = 10;
          if (minuendTens.innerText > subtrahendTens.innerText) {
            borrowTens.correctValue = minuendTens.innerText - 1;
            borrow2Tens.correctValue = -1;
            borrowHundreds.correctValue = -1;
            //minuendTens.style.textDecoration = "line-through";
            //minuendTens.style.textDecorationColor = "#FF0000";
            focusArray.push(minuendTens);
            focusArray.push(borrowTens);
            focusArray.push(borrowOnes);
            focusArray.push(inputOnes);
            focusArray.push(inputTens);
            focusArray.push(inputHundreds);
            //borrowTens.focus();
          } else {
            if (minuendTens.innerText == 0) {
              borrowTens.correctValue = 10;
              borrow2Tens.correctValue = 9;
              //minuendHundreds.style.textDecoration = "line-through";
              //minuendHundreds.style.textDecorationColor = "#FF0000";
              focusArray.push(minuendHundreds);
              focusArray.push(borrowHundreds);
              focusArray.push(borrowTens);
              focusArray.push(borrow2Tens);
              focusArray.push(borrowOnes);
              focusArray.push(inputOnes);
              focusArray.push(inputTens);
              focusArray.push(inputHundreds);
              //borrowHundreds.focus();
              //borrowTens.style.textDecoration = "line-through";
            } else {
              borrowTens.correctValue = minuendTens.innerText - 1;
              borrow2Tens.correctValue = 10;
              //minuendTens.style.textDecoration = "line-through";
              //minuendTens.style.textDecorationColor = "#FF0000";

              focusArray.push(minuendTens);
              focusArray.push(borrowTens);
              focusArray.push(borrowOnes);
              focusArray.push(inputOnes);
              focusArray.push(minuendHundreds);
              focusArray.push(borrowHundreds);
              focusArray.push(borrow2Tens);
              focusArray.push(inputTens);
              focusArray.push(inputHundreds);

              //borrowTens.focus();
            }
            borrowHundreds.correctValue = minuendHundreds.innerText - 1;
            //minuendHundreds.style.textDecoration = "line-through";
          }
        }

        let currentFocus = focusArray.shift();

        if (currentFocus.tagName.toLowerCase() == "td") {
          currentFocus.style.textDecoration = "line-through";
          currentFocus.style.textDecorationColor = "#FF0000";
          currentFocus.focus();
          //console.log("第一個標籤是:" + currentFocus.id);

          currentFocus = focusArray.shift();
        }
        currentFocus.style.display = "block";
        currentFocus.focus();
      }

      function showRecords() {
        if (!window.userName) {
          alert("請先輸入姓名以查閱記錄！");
          return;
        }

        // 從 localStorage 獲取當前使用者的記錄
        const records =
          JSON.parse(localStorage.getItem(`${window.userName}-records`)) || [];

        // 檢查是否有記錄
        if (records.length === 0) {
          alert("沒有找到任何歷史記錄！");
          return;
        }

        // 創建一個顯示記錄的 HTML 字符串
        let recordsHtml = "<h3>歷史記錄</h3><ul>";

        // 反向遍歷以顯示最新的記錄在最上方
        for (let i = records.length - 1; i >= 0; i--) {
          const record = records[i];
          // 加入流水編號
          const recordNumber = records.length - i; // 計算編號
          recordsHtml += `<li>${recordNumber}，姓名: ${record.name}，日期: ${record.date}，單元: ${record.unit}，時間：${record.time}</li>`;
        }

        recordsHtml += "</ul>";

        // 在滾動容器中顯示歷史記錄
        document.getElementById("result-message").innerHTML = recordsHtml;
      }

      function clearRecords() {
        if (!window.userName) {
          alert("請先輸入姓名以清除記錄！");
          return;
        }

        // 從 localStorage 清除當前使用者的記錄
        localStorage.removeItem(`${window.userName}-records`);
        alert("歷史記錄已清除！");

        // 返回主選單
        restartGame(); // 調用重新開始遊戲的函數
      }

      function showResult() {
        clearInterval(timerInterval); // 停止計時器
        document.getElementById("game-container").style.display = "none";
        document.getElementById("result-container").style.display = "block";

        const minutes = Math.floor(elapsedTime / 60);
        const seconds = elapsedTime % 60;
        const formattedTime = `${String(minutes).padStart(2, "0")}分 ${String(
          seconds
        ).padStart(2, "0")}秒`;

        // 獲取當前日期
        const today = new Date();
        const year = today.getFullYear() - 1911; // 轉換為民國年份
        const month = today.getMonth() + 1; // 月份從0開始
        const day = today.getDate();
        const formattedDate = `${year}/${month}/${day}`; // 格式化日期

        // 獲取單元資訊
        const subtractionType = document.querySelector(
          'input[name="subtractionType"]:checked'
        ).nextSibling.textContent;

        const borrowType = document.querySelector(
          'input[name="borrowType"]:checked'
        ).nextSibling.textContent;

        // 結果資訊
        const resultMessage = `姓名：${window.userName}<br>
        日期：${formattedDate}<br>
        單元：${subtractionType}(${borrowType}) - 共${totalQuestions}題<br>
        時間：${formattedTime}`;

        // 顯示結果
        document.getElementById("result-message").innerHTML = resultMessage;

        // 只有在使用者輸入姓名時才保存記錄
        if (window.userName) {
          const record = {
            name: window.userName,
            date: formattedDate,
            unit: `${subtractionType}(${borrowType}) - 共${totalQuestions}題`,
            time: formattedTime,
          };

          // 從 localStorage 獲取現有記錄
          let records =
            JSON.parse(localStorage.getItem(`${window.userName}-records`)) ||
            [];
          records.push(record); // 添加新記錄

          // 保存更新後的記錄到 localStorage
          localStorage.setItem(
            `${window.userName}-records`,
            JSON.stringify(records)
          );
        }
      }

      // 重新開始遊戲
      function restartGame() {
        document.getElementById("result-container").style.display = "none";
        document.getElementById("menu-container").style.display = "block";
      }

      // 處理選擇變化
      function handleUserNameChange() {
        const selectElement = document.getElementById("user-name");
        const selectedValue = selectElement.value;

        if (selectedValue === "custom") {
          // 如果選擇了自訂，清空選擇並允許輸入
          const customName = prompt("請輸入自訂姓名:");
          if (customName) {
            // 添加新姓名到下拉式功能表和 localStorage
            const option = new Option(customName, customName);
            selectElement.appendChild(option);
            selectElement.value = customName; // 設置為選中
            addUserNameToRecords(customName); // 保存到 localStorage
          } else {
            selectElement.value = ""; // 清空選擇
          }
        }
      }

      // 保存自訂姓名到 localStorage
      function addUserNameToRecords(name) {
        const records = JSON.parse(localStorage.getItem("records")) || [];
        records.push({ name: name }); // 這裡可以添加更多資訊
        localStorage.setItem("records", JSON.stringify(records)); // 更新 localStorage
      }

      function clearUserNameRecords() {
        localStorage.removeItem("records"); // 清除所有姓名記錄
        document.getElementById("user-name").innerHTML =
          '<option value="">-- 選擇姓名 --</option><option value="custom">自訂姓名</option>'; // 清空下拉選項
        alert("姓名記錄已清除！"); // 提示用戶
      }

      window.onload = function () {
        const records = JSON.parse(localStorage.getItem("records")) || []; // 讀取所有使用者記錄
        const selectElement = document.getElementById("user-name");

        // 添加記錄中的使用者姓名到下拉式功能表
        const userNames = new Set(); // 使用 Set 去重
        records.forEach((record) => {
          userNames.add(record.name); // 將姓名添加到 Set 中以避免重複
        });

        // 將 Set 中的姓名添加到下拉式功能表
        userNames.forEach((name) => {
          const option = document.createElement("option");
          option.value = name;
          option.textContent = name;
          selectElement.appendChild(option);
        });

        let inputOnes = document.getElementById("inputOnes");
        let inputTens = document.getElementById("inputTens");
        let inputHundreds = document.getElementById("inputHundreds");
        let borrowOnes = document.getElementById("borrowOnes");
        let borrowTens = document.getElementById("borrowTens");
        let borrow2Tens = document.getElementById("borrow2Tens");
        let borrowHundreds = document.getElementById("borrowHundreds");
        let minuendHundreds = document.getElementById("minuendHundreds");
        let minuendTens = document.getElementById("minuendTens");
        let minuendOnes = document.getElementById("minuendOnes");
        let subtrahendOnes = document.getElementById("subtrahendOnes");
        let subtrahendTens = document.getElementById("subtrahendTens");
        let subtrahendHundreds = document.getElementById("subtrahendHundreds");

        var resultMessage = document.getElementById("resultMessage");
        var promptMessage = document.getElementById("promptMessage");

        let inputArray = [
          inputOnes,
          inputTens,
          inputHundreds,
          borrowOnes,
          borrowTens,
          borrow2Tens,
          borrowHundreds,
        ];

        inputArray.forEach((tag, index) => {
          tag.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
              if (tag.value === tag.correctValue.toString()) {
                resultMessage.innerText = "😊";
                promptMessage.innerText = "";
                promptMessage.style.display = "none";
                inputOnes.style.backgroundColor = "white";
                inputTens.style.backgroundColor = "white";
                inputHundreds.style.backgroundColor = "white";
                borrowOnes.style.backgroundColor = "white";
                borrowTens.style.backgroundColor = "white";
                borrow2Tens.style.backgroundColor = "white";
                borrowHundreds.style.backgroundColor = "white";
                minuendHundreds.style.backgroundColor = "white";
                minuendTens.style.backgroundColor = "white";
                minuendOnes.style.backgroundColor = "white";
                subtrahendOnes.style.backgroundColor = "white";
                subtrahendTens.style.backgroundColor = "white";
                subtrahendHundreds.style.backgroundColor = "white";

                if (
                  tag === borrowTens &&
                  tag.correctValue.toString() === "10" &&
                  minuendTens.innerText === "0"
                ) {
                  tag.style.textDecoration = "line-through";
                  tag.style.textDecorationColor = "#FF0000";
                }

                let 本題完全答對 = false;
                if (
                  tag === inputOnes &&
                  inputTens.correctValue.toString() === "0" &&
                  inputHundreds.correctValue.toString() === "0"
                ) {
                  本題完全答對 = true;
                }
                if (
                  tag === inputTens &&
                  inputHundreds.correctValue.toString() === "0"
                ) {
                  本題完全答對 = true;
                }

                setTimeout(function () {
                  resultMessage.innerText = "";
                  if (
                    tag === inputOnes &&
                    inputTens.correctValue.toString() === "0" &&
                    inputHundreds.correctValue.toString() === "0"
                  ) {
                    generateProblem();
                    return;
                  }

                  if (
                    tag === inputTens &&
                    inputHundreds.correctValue.toString() === "0"
                  ) {
                    generateProblem();
                    return;
                  }

                  if (tag === inputHundreds) {
                    generateProblem();
                    return;
                  }
                }, 1000);

                if (!本題完全答對 && focusArray.length > 0) {
                  let currentFocus = focusArray.shift();

                  if (currentFocus.tagName.toLowerCase() == "td") {
                    currentFocus.style.textDecoration = "line-through";
                    currentFocus.style.textDecorationColor = "red";
                    currentFocus.focus();
                    currentFocus = focusArray.shift();
                  }

                  currentFocus.style.display = "block";
                  currentFocus.focus();
                }
              } else {
                tag.classList.add("shake");
                tag.select();
                resultMessage.innerText = "🥶";
                setTimeout(function () {
                  tag.classList.remove("shake");
                  resultMessage.innerText = "";
                }, 1000);
              }
            }
          });
        });

        let borrowedArrary = [
          minuendHundreds,
          minuendTens,
          borrowTens,
          borrow2Tens,
        ];
        borrowedArrary.forEach((tag, index) => {
          tag.addEventListener("focus", function () {
            if (
              tag.style.textDecoration.toString().indexOf("line-through") == 0
            ) {
              if (tag == minuendTens) {
                promptMessage.style.display = "block";
                promptMessage.innerText = `個位數的${minuendOnes.innerText}無法減${subtrahendOnes.innerText}，必須先跟十位數的${minuendTens.innerText}借`;
                minuendOnes.style.backgroundColor = "#5CADAD";
                subtrahendOnes.style.backgroundColor = "#5CADAD";
              } else if (tag == minuendHundreds) {
                if (
                  minuendTens.style.textDecoration
                    .toString()
                    .indexOf("line-through") == 0
                ) {
                  promptMessage.style.display = "block";
                  promptMessage.innerText = `十位數的${borrowTens.correctValue.toString()}無法減${
                    subtrahendTens.innerText
                  }，必須先跟百位數的${minuendHundreds.innerText}借`;
                  borrowTens.style.backgroundColor = "#5CADAD";
                  subtrahendTens.style.backgroundColor = "#5CADAD";
                } else {
                  if (minuendOnes.innerText < subtrahendOnes.innerText) {
                    promptMessage.style.display = "block";
                    promptMessage.innerText = `個位數的${minuendOnes.innerText}無法減${subtrahendOnes.innerText}，所以必須跟十位數的0借，但0無法被借，所以再跟百位數的${minuendHundreds.innerText}借`;
                    minuendOnes.style.backgroundColor = "#5CADAD";
                    subtrahendOnes.style.backgroundColor = "#5CADAD";
                  } else {
                    promptMessage.style.display = "block";
                    promptMessage.innerText = `十位數的${minuendTens.innerText}無法減${subtrahendTens.innerText}，必須先跟百位數的${minuendHundreds.innerText}借`;
                    minuendTens.style.backgroundColor = "#5CADAD";
                    subtrahendTens.style.backgroundColor = "#5CADAD";
                  }
                }
              } else {
              }
            }

            if (
              tag === borrow2Tens &&
              borrowTens.correctValue.toString() === "10" &&
              tag.correctValue.toString() === "9"
            ) {
              promptMessage.style.display = "block";
              promptMessage.innerText = `個位數的${minuendOnes.innerText}無法減${subtrahendOnes.innerText}，必須先跟十位數的10借`;
              minuendOnes.style.backgroundColor = "#5CADAD";
              subtrahendOnes.style.backgroundColor = "#5CADAD";
            }
          });
        });
      };
    </script>
  </head>
  <body>
    <!-- 主畫面選單 -->
    <div id="menu-container" class="menu-container">
      <h2>三位數以內的減法</h2>
      
      <label for="user-name">請輸入姓名:</label>
      <select id="user-name" onchange="handleUserNameChange()">
        <option value="">-- 選擇姓名 --</option>
        <option value="custom">自訂姓名</option>
      </select>
      <button onclick="clearUserNameRecords()">清除姓名記錄</button>

      <br />
      <br />

      <label for="question-count">選擇題目數量:</label>
      <select id="question-count">
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="15">15</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="40">40</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>

      <br /><br />
      <div class="radio-group">
        <label style="font-size: 14px; margin-right: 10px">
          <input
            type="radio"
            name="subtractionType"
            value="1-1"
            style="transform: scale(0.8)"
            checked
          />
          一位減一位
        </label>
        <label style="font-size: 14px; margin-right: 10px">
          <input
            type="radio"
            name="subtractionType"
            value="2-1"
            style="transform: scale(0.8)"
          />
          二位減一位
        </label>
        <label style="font-size: 14px; margin-right: 10px">
          <input
            type="radio"
            name="subtractionType"
            value="2-2"
            style="transform: scale(0.8)"
          />
          二位減二位
        </label>
        <label style="font-size: 14px; margin-right: 10px">
          <input
            type="radio"
            name="subtractionType"
            value="3-1"
            style="transform: scale(0.8)"
          />
          三位減一位
        </label>
        <label style="font-size: 14px; margin-right: 10px">
          <input
            type="radio"
            name="subtractionType"
            value="3-2"
            style="transform: scale(0.8)"
          />
          三位減二位
        </label>
        <label style="font-size: 14px; margin-right: 10px">
          <input
            type="radio"
            name="subtractionType"
            value="3-3"
            style="transform: scale(0.8)"
          />
          三位減三位
        </label>
      </div>
      <br />
      <div class="radio-group">
        <label style="font-size: 14px; margin-right: 10px">
          <input
            type="radio"
            name="borrowType"
            value="1"
            checked
            style="transform: scale(0.8)"
          />
          隨機
        </label>

        <label style="font-size: 14px; margin-right: 10px">
          <input
            type="radio"
            name="borrowType"
            value="2"
            style="transform: scale(0.8)"
          />
          借位
        </label>
        <label style="font-size: 14px; margin-right: 10px">
          <input
            type="radio"
            name="borrowType"
            value="3"
            style="transform: scale(0.8)"
          />
          不借位
        </label>
        <br />
        <label for="repeat-count" style="font-size: 14px; margin-right: 10px">同一題做答次數:</label>
        <select id="repeat-count">
          
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>
      <br />
      <button onclick="startGame()">確定</button>

      <div
        id="footer"
        style="
          position: absolute;
          bottom: 20px;
          right: 20px;
          font-size: 12px;
          color: gray;
        "
      >
        苗栗縣公館國小資源班
      </div>
    </div>
    <!-- 測驗畫面 -->
    <div id="game-container" class="game-container" style="display: none">
      <div
        class="question-counter"
        id="question-counter"
        style="position: absolute; top: 20px; left: 20px; font-size: 20px"
      >
        第 <span id="current-question">1</span>/
        <span id="total-questions">1</span>題 
            [第<span id="currentRepeatTag"> 1 </span>次嘗試]
      </div>
      <div
        class="timer"
        id="timer"
        style="position: absolute; top: 20px; right: 20px; font-size: 20px"
      >
        已用 <span id="elapsed-time">00:00</span>
      </div>
      <button
        id="pause-button"
        onclick="togglePause()"
        style="position: absolute; bottom: 20px; left: 20px"
      >
        暫停
      </button>
      <table width="500px" style="vertical-align: top">
        <tr>
          <td width="300px" class="no-border" style="text-align: left">
            <table>
              <tr>
                <td class="no-border"></td>
                <td class="no-border">百</td>
                <td class="no-border">十</td>
                <td class="no-border">個</td>
              </tr>
              <tr>
                <td class="no-border"></td>
                <td class="no-border"></td>
                <td class="no-border">
                  <input
                    type="text"
                    id="borrow2Tens"
                    style="
                      width: 40px;
                      height: 30px;
                      font-size: 30px;
                      text-align: center;
                      color: #ff0000;
                    "
                  />
                </td>
                <td class="no-border"></td>
              </tr>
              <tr>
                <td class="no-border"></td>
                <td class="no-border">
                  <input
                    type="text"
                    id="borrowHundreds"
                    style="
                      width: 40px;
                      height: 30px;
                      font-size: 30px;
                      text-align: center;
                      color: #ff0000;
                    "
                  />
                </td>
                <td class="no-border">
                  <input
                    type="text"
                    id="borrowTens"
                    style="
                      width: 40px;
                      height: 30px;
                      font-size: 30px;
                      text-align: center;
                      color: #ff0000;
                    "
                  />
                </td>
                <td class="no-border">
                  <input
                    type="text"
                    id="borrowOnes"
                    style="
                      width: 40px;
                      height: 30px;
                      font-size: 30px;
                      text-align: center;
                      color: #ff0000;
                    "
                  />
                </td>
              </tr>

              <tr>
                <td class="no-border"></td>
                <td id="minuendHundreds" tabindex="0">2</td>
                <td id="minuendTens" tabindex="0">2</td>
                <td id="minuendOnes">7</td>
              </tr>
              <tr>
                <td>-</td>
                <td id="subtrahendHundreds">1</td>
                <td id="subtrahendTens">1</td>
                <td id="subtrahendOnes">6</td>
              </tr>

              <tr>
                <td class="line no-border"></td>
                <td class="line no-border">
                  <input
                    type="text"
                    id="inputHundreds"
                    style="
                      width: 40px;
                      height: 30px;
                      font-size: 30px;
                      text-align: center;
                    "
                  />
                </td>
                <td class="line no-border">
                  <input
                    type="text"
                    id="inputTens"
                    style="
                      width: 40px;
                      height: 30px;
                      font-size: 30px;
                      text-align: center;
                    "
                  />
                </td>
                <td class="line no-border">
                  <input
                    type="text"
                    id="inputOnes"
                    style="
                      width: 40px;
                      height: 30px;
                      font-size: 30px;
                      text-align: center;
                    "
                  />
                </td>
              </tr>
            </table>
          </td>
          <td width="200px" class="no-border">
            <div
              id="promptMessage"
              style="
                width: 100px;
                font-size: 20px;
                border-radius: 10px;
                border: 1px solid black;
                padding: 20px;
                background-color: #f3f3fa;
                display: none;
              "
            ></div>
            <br />
            <span id="resultMessage" style="font-size: 100px"></span>
          </td>
        </tr>
      </table>
    </div>
    <!-- 結果畫面 -->
    <div id="result-container" class="result-container" style="display: none">
      <h3>測驗完成！</h3>
      <div
        id="scroll-container"
        style="
          max-height: 200px;
          overflow-y: auto;
          border: 1px solid #ccc;
          padding: 10px;
          border-radius: 5px;
        "
      >
        <p id="result-message" style="text-align: left"></p>
      </div>
      <!-- 在結果畫面中添加兩個按鈕 -->
      <br /><br />
      <button onclick="showRecords()">查閱過去記錄</button>
      <button onclick="clearRecords()">清除歷史記錄</button>

      <button onclick="restartGame()">重新開始</button>
    </div>
  </body>
</html>
